# MongoDB local para el prototipo.  Uso:  docker compose up -d   (luego MONGO_URI=mongodb://localhost:27017)
services:
  mongo:
    image: mongo:7
    container_name: sig-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
